name: "N8N"
description: "N8N - Workflow Automation Tool. Connect your apps and automate workflows."
version: "1.0.0"
slug: "n8n"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
ports:
  5678/tcp: 5678
ports_description:
  5678/tcp: "N8N Web Interface"
map:
  - type: share
    read_only: false
options:
  ssl: false
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
  username: "admin"
  password: "admin"
  timezone: "Europe/Paris"
  webhook_url: ""
schema:
  ssl: bool
  certfile: str
  keyfile: str
  username: str
  password: str
  timezone: str
  webhook_url: str
url: "https://github.com/Quentin-CS/ha-addon-n8n"
ingress: true
ingress_port: 5678
panel_icon: "mdi:workflow"
panel_title: "N8N"
