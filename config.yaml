name: "N8N"
description: "N8N - Workflow Automation Tool. Connect your apps and automate workflows."
version: "1.0.0"
slug: "n8n"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
ports:
  5678/tcp: 5678
ports_description:
  5678/tcp: "N8N Web Interface"
map:
  - share:rw
  - config:ro
options:
  ssl: false
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
  username: ""
  password: ""
  timezone: "Europe/Paris"
  webhook_url: ""
  generic_timezone: "Europe/Paris"
schema:
  ssl: bool
  certfile: str
  keyfile: str
  username: str
  password: str
  timezone: str
  webhook_url: str
  generic_timezone: str
image: "ghcr.io/hassio-addons/n8n/{arch}"
url: "https://github.com/hassio-addons/addon-n8n"
homeassistant_api: false
hassio_api: false
auth_api: false
ingress: true
ingress_port: 5678
panel_icon: "mdi:workflow"
panel_title: "N8N"
